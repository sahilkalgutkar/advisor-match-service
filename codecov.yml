comment:
  layout: "condensed_header, diff, flags, condensed_files"
  behavior: default
  require_changes: false

coverage:
  status:
    project:
      default:
        target: 80%
    patch:
      default:
        target: 80%

# Pure wiring with no testable branching logic: wsgi.py just calls the
# already-tested app factory, and scripts/seed_index.py sequences already-
# tested functions with no logic of its own.
ignore:
  - "wsgi.py"
  - "scripts/seed_index.py"
